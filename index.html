<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScrambleMaster · Word Scramble</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e6f0f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .game-card {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            box-shadow: 0 20px 40px -10px rgba(0, 40, 80, 0.25);
            padding: 28px 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.2s ease;
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #1a3b5d;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1 span {
            background: #ffe9a7;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #7d5d23;
        }
        .scrambled-box {
            background: #1a3b5d;
            border-radius: 24px;
            padding: 24px 12px;
            margin: 24px 0 20px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.2), 0 8px 0 #0f2a41;
        }
        #scrambledWord {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #f7e05e;
            text-shadow: 0 3px 0 #b28f2c;
            word-break: break-word;
            line-height: 1.2;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin: 20px 0 12px;
            flex-wrap: wrap;
        }
        #guessInput {
            flex: 1 1 200px;
            padding: 16px 18px;
            border: 2px solid #cbd6e3;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 500;
            text-transform: uppercase;
            background: white;
            outline: none;
            transition: border 0.15s;
        }
        #guessInput:focus {
            border-color: #1a3b5d;
        }
        .primary-btn {
            background: #2e6b3e;
            color: white;
            border: none;
            padding: 16px 28px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 0 #1d4529;
            transition: 0.07s linear;
            border: 1px solid #58a36f;
        }
        .primary-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1d4529;
        }
        .primary-btn:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: 0 6px 0 #1d4529;
            pointer-events: none;
        }
        .message {
            min-height: 40px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #1a3b5d;
            margin: 12px 0 8px;
            padding: 8px 12px;
            background: #e8f0fe;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reward-row {
            display: flex;
            gap: 12px;
            margin: 24px 0 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .reward-btn {
            background: #f4a261;
            border: none;
            color: #2d1f00;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 14px 24px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 0 #b96f2e;
            transition: 0.07s linear;
            flex: 1 1 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid #ffc107;
        }
        .reward-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b96f2e;
        }
        .reward-btn i {
            font-style: normal;
            font-size: 1.3rem;
        }
        .ad-section-title {
            font-size: 0.9rem;
            color: #1a3b5d;
            margin: 20px 0 10px;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .interstitial-btn {
            background: #9b59b6;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 14px 24px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 0 #6c3483;
            transition: 0.07s linear;
            width: 100%;
            border: 1px solid #c39bd3;
        }
        .interstitial-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #6c3483;
        }
        .task-btn {
            background: #27ae60;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 14px 24px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1e8449;
            transition: 0.07s linear;
            width: 100%;
            border: 1px solid #6fcf97;
        }
        .task-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1e8449;
        }
        .debug-badge {
            background: #ff6b6b;
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
            text-transform: uppercase;
        }
        .debug-panel {
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0;
            font-size: 0.85rem;
            text-align: left;
        }
        .debug-panel h4 {
            margin-bottom: 8px;
            color: #1a3b5d;
        }
        .debug-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        .debug-btn:hover {
            background: #2980b9;
        }
        .log-entry {
            font-family: monospace;
            font-size: 0.75rem;
            border-bottom: 1px solid #ddd;
            padding: 4px 0;
        }
        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #5d738b;
            display: flex;
            justify-content: center;
            gap: 24px;
            border-top: 1px dashed #b3c7db;
            padding-top: 20px;
        }
        footer a {
            color: #1a3b5d;
            text-decoration: none;
            font-weight: 500;
        }
        footer a:hover {
            text-decoration: underline;
        }
        .score-badge {
            background: #d4e0eb;
            border-radius: 50px;
            padding: 6px 16px;
            font-size: 1rem;
            font-weight: 600;
            color: #0f2a41;
            display: inline-block;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .status-green { background: #2ecc71; }
        .status-red { background: #e74c3c; }
        .status-yellow { background: #f39c12; }
    </style>
</head>
<body>
    <div class="game-card">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <h1>🔤 SCRAMBLE<span>free</span></h1>
            <div class="score-badge" id="scoreDisplay">0</div>
        </div>
        <p style="color: #4a5f73; margin-bottom: 8px;">unscramble the word — no ads needed</p>

        <!-- Debug Panel -->
        <div class="debug-panel">
            <h4>🛠️ DEBUG INFORMATION</h4>
            <div id="debugStatus">Initializing...</div>
            <div style="margin-top: 10px;">
                <button class="debug-btn" id="testRewardedBtn">Test Rewarded Ad</button>
                <button class="debug-btn" id="testInterstitialBtn">Test Interstitial</button>
                <button class="debug-btn" id="testTaskBtn">Test Task Ad</button>
                <button class="debug-btn" id="checkCampaignsBtn">Check Campaigns</button>
            </div>
            <div style="margin-top: 10px; max-height: 100px; overflow-y: auto;" id="logContainer">
                <div class="log-entry">Ready for actions...</div>
            </div>
        </div>

        <div class="scrambled-box">
            <div id="scrambledWord">......</div>
        </div>

        <div class="input-area">
            <input type="text" id="guessInput" placeholder="YOUR GUESS" maxlength="20" autocomplete="off">
            <button class="primary-btn" id="submitGuess">GUESS</button>
        </div>

        <div id="message" class="message">✨ type your answer</div>

        <!-- REWARDED ADS (24919) -->
        <div class="ad-section-title">
            🎁 REWARDED ADS <span class="debug-badge">24919</span>
        </div>
        <div class="reward-row">
            <button class="reward-btn" id="hintBtn"><i>🔍</i> Hint (watch ad)</button>
            <button class="reward-btn" id="skipBtn"><i>🌀</i> Skip word (watch ad)</button>
        </div>

        <!-- INTERSTITIAL ADS (int-24917) -->
        <div class="ad-section-title">
            📺 INTERSTITIAL ADS <span class="debug-badge">int-24917</span>
        </div>
        <button class="interstitial-btn" id="interstitialBtn">🎮 Show Interstitial Ad</button>

        <!-- TASK ADS (task-24920) -->
        <div class="ad-section-title">
            📋 TASK ADS <span class="debug-badge">task-24920</span>
        </div>
        <button class="task-btn" id="taskBtn">✅ Show Task Ad</button>

        <footer>
            <a href="#" target="_blank" id="privacyLink">📄 Privacy Policy</a>
            <span>v1.0</span>
        </footer>
    </div>

    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <script>
        (function() {
            // ====================================================
            // YOUR BLOCK IDS
            // ====================================================
            const REWARD_BLOCK_ID = "24919";           // Rewarded ad format
            const INTERSTITIAL_BLOCK_ID = "int-24917";  // Interstitial ad format
            const TASK_BLOCK_ID = "task-24920";         // Task ad format
            
            // ====================================================
            // PRODUCTION MODE - Set to false for real ads
            // ====================================================
            const DEBUG_MODE = false;  // false = real ads, true = test ads
            
            // ====================================================
            // WORD LIST
            // ====================================================
            const words = [
                "PLANET", "MOUNTAIN", "COFFEE", "WINDOW", "GALAXY", 
                "PYTHON", "JOURNEY", "HARMONY", "VELVET", "CRYSTAL",
                "THUNDER", "MEADOW", "SAFARI", "POCKET", "BRAIN",
                "FLAMINGO", "KITTEN", "PUZZLE", "RIDDLE", "SUMMER",
                "WINTER", "AUTUMN", "SPRING", "CLOUD", "RIVER",
                "HORIZON", "DIAMOND", "SILVER", "GARDEN", "BREEZE"
            ];

            // Game state
            let currentWord = "";
            let scrambled = "";
            let score = 0;
            let rewardedController = null;
            let interstitialController = null;

            // DOM elements
            const scrambledEl = document.getElementById('scrambledWord');
            const guessInput = document.getElementById('guessInput');
            const submitBtn = document.getElementById('submitGuess');
            const messageEl = document.getElementById('message');
            const scoreEl = document.getElementById('scoreDisplay');
            const hintBtn = document.getElementById('hintBtn');
            const skipBtn = document.getElementById('skipBtn');
            const interstitialBtn = document.getElementById('interstitialBtn');
            const taskBtn = document.getElementById('taskBtn');
            
            // Debug elements
            const debugStatus = document.getElementById('debugStatus');
            const logContainer = document.getElementById('logContainer');

            // ====================================================
            // LOGGING FUNCTION
            // ====================================================
            function addLog(message, type = 'info') {
                const logEntry = document.createElement('div');
                logEntry.className = 'log-entry';
                const timestamp = new Date().toLocaleTimeString();
                
                let color = '#333';
                if (type === 'success') color = '#27ae60';
                if (type === 'error') color = '#e74c3c';
                if (type === 'warning') color = '#f39c12';
                
                logEntry.innerHTML = `<span style="color: ${color};">[${timestamp}] ${message}</span>`;
                logContainer.appendChild(logEntry);
                logContainer.scrollTop = logContainer.scrollHeight;
                
                console.log(`[${type}] ${message}`);
            }

            // ====================================================
            // INITIALIZE ADSGRAM SDK WITH EVENT LISTENERS
            // ====================================================
            function initAdsgram() {
                try {
                    if (window.Adsgram) {
                        debugStatus.innerHTML = '<span class="status-indicator status-green"></span> Adsgram SDK loaded';
                        addLog(`✅ Adsgram SDK loaded, DEBUG_MODE: ${DEBUG_MODE ? 'ON (test ads)' : 'OFF (real ads)'}`, 'success');
                        
                        // ========================================
                        // Initialize Rewarded Ad Controller (24919)
                        // ========================================
                        rewardedController = window.Adsgram.init({ 
                            blockId: REWARD_BLOCK_ID,
                            debug: DEBUG_MODE,
                            debugBannerType: "RewardedVideo"
                        });
                        
                        // Add event listeners for rewarded ads
                        rewardedController.addEventListener('onBannerNotFound', () => {
                            addLog('🔍 EVENT: onBannerNotFound - No ad available for this request', 'warning');
                            addLog('   → Campaigns active but no match for your profile/region/time', 'warning');
                            messageEl.innerText = 'No ads match your profile right now';
                        });
                        
                        rewardedController.addEventListener('onStart', () => {
                            addLog('✅ EVENT: onStart - Ad started playing', 'success');
                        });
                        
                        rewardedController.addEventListener('onComplete', () => {
                            addLog('✅ EVENT: onComplete - Ad finished', 'success');
                        });
                        
                        rewardedController.addEventListener('onReward', () => {
                            addLog('🎁 EVENT: onReward - User should get reward', 'success');
                        });
                        
                        rewardedController.addEventListener('onSkip', () => {
                            addLog('⏭️ EVENT: onSkip - User closed ad early', 'warning');
                        });
                        
                        rewardedController.addEventListener('onError', (result) => {
                            addLog(`❌ EVENT: onError - ${result.description || 'Unknown error'}`, 'error');
                        });
                        
                        addLog('✅ Rewarded ads initialized with event listeners', 'success');
                        
                        // ========================================
                        // Initialize Interstitial Ad Controller (int-24917)
                        // ========================================
                        interstitialController = window.Adsgram.init({ 
                            blockId: INTERSTITIAL_BLOCK_ID,
                            debug: DEBUG_MODE,
                            debugBannerType: "FullscreenMedia"
                        });
                        
                        // Add event listeners for interstitial
                        interstitialController.addEventListener('onBannerNotFound', () => {
                            addLog('🔍 Interstitial: No ad available', 'warning');
                        });
                        
                        interstitialController.addEventListener('onStart', () => {
                            addLog('✅ Interstitial: Ad started', 'success');
                        });
                        
                        interstitialController.addEventListener('onComplete', () => {
                            addLog('✅ Interstitial: Ad completed', 'success');
                        });
                        
                        interstitialController.addEventListener('onError', (result) => {
                            addLog(`❌ Interstitial error: ${result.description}`, 'error');
                        });
                        
                        addLog('✅ Interstitial ads initialized with event listeners', 'success');
                        
                        messageEl.innerText = DEBUG_MODE ? 
                            '🧪 Test mode active' : 
                            '📺 Real ads mode - waiting for campaigns';
                        
                    } else {
                        debugStatus.innerHTML = '<span class="status-indicator status-red"></span> Adsgram SDK not loaded';
                        addLog('❌ Adsgram SDK not loaded, retrying...', 'error');
                        setTimeout(initAdsgram, 1000);
                    }
                } catch (error) {
                    debugStatus.innerHTML = '<span class="status-indicator status-red"></span> Initialization error';
                    addLog(`❌ Adsgram init error: ${error.message}`, 'error');
                }
            }

            // Initialize when page loads
            initAdsgram();

            // ====================================================
            // SHOW REWARDED AD
            // ====================================================
            function showRewardedAd(rewardCallback) {
                if (!rewardedController) {
                    alert('Rewarded ads not ready. Please try again.');
                    return;
                }

                addLog('🎬 Attempting to show rewarded ad...', 'info');
                messageEl.innerText = '⏳ Loading rewarded ad...';
                
                rewardedController.show()
                    .then((result) => {
                        addLog(`✅ Rewarded ad completed: ${JSON.stringify(result)}`, 'success');
                        
                        if (result.done) {
                            addLog('🎁 Ad watched till end - giving reward', 'success');
                            if (rewardCallback) rewardCallback();
                            messageEl.innerText = '✨ Thanks! Here\'s your reward:';
                        } else {
                            addLog('❌ Ad not completed - no reward', 'warning');
                            messageEl.innerText = '❌ Ad not completed. No reward.';
                        }
                    })
                    .catch((result) => {
                        addLog(`❌ Rewarded ad error: ${result.description || 'Unknown error'}`, 'error');
                        
                        if (result.description) {
                            if (result.description.includes('No fill')) {
                                messageEl.innerText = '📺 No ads available for your region/time';
                                addLog('   → This means campaigns are active but no match for your profile', 'warning');
                            } else if (result.description.includes('Invalid block')) {
                                messageEl.innerText = '❌ Block ID issue - check dashboard';
                                addLog('   → Block ID may be incorrect or inactive', 'error');
                            } else {
                                messageEl.innerText = `❌ ${result.description}`;
                            }
                        } else {
                            messageEl.innerText = '❌ Ad failed. Try again?';
                        }
                    });
            }

            // ====================================================
            // SHOW INTERSTITIAL AD
            // ====================================================
            function showInterstitialAd() {
                if (!interstitialController) {
                    alert('Interstitial ads not ready. Please try again.');
                    return;
                }

                addLog('🎬 Attempting to show interstitial ad...', 'info');
                messageEl.innerText = '⏳ Loading interstitial ad...';
                
                interstitialController.show()
                    .then((result) => {
                        addLog(`✅ Interstitial ad completed: ${JSON.stringify(result)}`, 'success');
                        
                        if (result.done) {
                            messageEl.innerText = '📺 Ad watched completely! +1 bonus!';
                        } else {
                            messageEl.innerText = '📺 Ad closed. +1 bonus!';
                        }
                        
                        score++;
                        updateScore();
                    })
                    .catch((result) => {
                        addLog(`❌ Interstitial ad error: ${result.description || 'Unknown error'}`, 'error');
                        
                        if (result.description && result.description.includes('No fill')) {
                            messageEl.innerText = '📺 No interstitial ads available';
                        } else {
                            messageEl.innerText = '❌ Interstitial ad failed.';
                        }
                    });
            }

            // ====================================================
            // SHOW TASK AD
            // ====================================================
            function showTaskAd() {
                if (!window.Adsgram || !window.Adsgram.TaskAd) {
                    alert('Task ads not available. Please try again.');
                    return;
                }

                addLog('🎬 Attempting to show task ad...', 'info');
                messageEl.innerText = '⏳ Loading task ad...';
                
                const taskAd = window.Adsgram.TaskAd.init({ 
                    blockId: TASK_BLOCK_ID,
                    debug: DEBUG_MODE
                });
                
                taskAd.show()
                    .then((result) => {
                        addLog(`✅ Task ad completed: ${JSON.stringify(result)}`, 'success');
                        messageEl.innerText = '✅ Task completed! +2 bonus points!';
                        
                        score += 2;
                        updateScore();
                    })
                    .catch((result) => {
                        addLog(`❌ Task ad error: ${result.description || 'Unknown error'}`, 'error');
                        
                        if (result.description && result.description.includes('No fill')) {
                            messageEl.innerText = '📺 No task ads available';
                        } else {
                            messageEl.innerText = '❌ Task failed. Try again?';
                        }
                    });
            }

            // ====================================================
            // CHECK CAMPAIGN STATUS
            // ====================================================
            function checkCampaigns() {
                addLog('🔍 Checking campaign status...', 'info');
                addLog(`Block IDs:`, 'info');
                addLog(`  - Rewarded: ${REWARD_BLOCK_ID}`, 'info');
                addLog(`  - Interstitial: ${INTERSTITIAL_BLOCK_ID}`, 'info');
                addLog(`  - Task: ${TASK_BLOCK_ID}`, 'info');
                
                if (rewardedController) {
                    addLog('✅ Rewarded controller: Initialized', 'success');
                } else {
                    addLog('❌ Rewarded controller: Not initialized', 'error');
                }
                
                if (interstitialController) {
                    addLog('✅ Interstitial controller: Initialized', 'success');
                } else {
                    addLog('❌ Interstitial controller: Not initialized', 'error');
                }
                
                addLog(`Current mode: ${DEBUG_MODE ? 'TEST ADS' : 'REAL ADS'}`, 'info');
                
                if (!DEBUG_MODE) {
                    addLog('⚠️ No ads appearing with real mode usually means:', 'warning');
                    addLog('   1. Geographic targeting - advertisers not targeting your country', 'warning');
                    addLog('   2. Time targeting - campaigns run at specific hours', 'warning');
                    addLog('   3. Fill rate - even active campaigns have limited impressions', 'warning');
                    addLog('   4. Try switching debug: true to confirm ads work', 'warning');
                }
            }

            // ====================================================
            // GAME FUNCTIONS
            // ====================================================
            function shuffleWord(word) {
                const arr = word.split('');
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr.join('');
            }

            function nextWord() {
                const randomIndex = Math.floor(Math.random() * words.length);
                currentWord = words[randomIndex].toUpperCase();
                scrambled = shuffleWord(currentWord);
                scrambledEl.innerText = scrambled;
                guessInput.value = '';
                messageEl.innerText = '🔎 new word!';
            }

            function updateScore() {
                scoreEl.innerText = score;
            }

            function checkGuess() {
                const guess = guessInput.value.trim().toUpperCase();
                if (guess === '') {
                    messageEl.innerText = '✏️ type your guess first';
                    return;
                }
                if (guess === currentWord) {
                    messageEl.innerText = '✅ CORRECT! +1 point';
                    score++;
                    updateScore();
                    nextWord();
                } else {
                    messageEl.innerText = '❌ not correct, try again';
                }
                guessInput.value = '';
            }

            // ====================================================
            // EVENT LISTENERS
            // ====================================================
            
            // Game buttons
            submitBtn.addEventListener('click', checkGuess);
            guessInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkGuess();
            });

            // Rewarded ad buttons
            hintBtn.addEventListener('click', () => {
                showRewardedAd(() => {
                    const firstLetter = currentWord[0];
                    messageEl.innerText = `🔍 Hint: first letter is “${firstLetter}”`;
                });
            });

            skipBtn.addEventListener('click', () => {
                showRewardedAd(() => {
                    nextWord();
                    messageEl.innerText = '✨ skipped to new word';
                });
            });

            // Interstitial ad button
            interstitialBtn.addEventListener('click', showInterstitialAd);

            // Task ad button
            taskBtn.addEventListener('click', showTaskAd);

            // Debug buttons
            document.getElementById('testRewardedBtn').addEventListener('click', () => {
                showRewardedAd(() => {
                    addLog('🎁 Reward given (test)', 'success');
                });
            });
            
            document.getElementById('testInterstitialBtn').addEventListener('click', showInterstitialAd);
            document.getElementById('testTaskBtn').addEventListener('click', showTaskAd);
            document.getElementById('checkCampaignsBtn').addEventListener('click', checkCampaigns);

            // ====================================================
            // INITIALIZATION
            // ====================================================
            
            // Start the game
            nextWord();
            
            // Update privacy link - REPLACE WITH YOUR ACTUAL URL
            document.getElementById('privacyLink').href = '#'; // Change to your privacy policy URL

            // Telegram Mini App integration
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                addLog('✅ Telegram WebApp initialized', 'success');
            }

            addLog('🚀 ScrambleMaster started', 'success');
            checkCampaigns();

        })();
    </script>
