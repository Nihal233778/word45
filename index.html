<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScrambleMaster · Word Scramble</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e6f0f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .game-card {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            box-shadow: 0 20px 40px -10px rgba(0, 40, 80, 0.25);
            padding: 28px 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.2s ease;
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #1a3b5d;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1 span {
            background: #ffe9a7;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #7d5d23;
        }
        .scrambled-box {
            background: #1a3b5d;
            border-radius: 24px;
            padding: 24px 12px;
            margin: 24px 0 20px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.2), 0 8px 0 #0f2a41;
        }
        #scrambledWord {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #f7e05e;
            text-shadow: 0 3px 0 #b28f2c;
            word-break: break-word;
            line-height: 1.2;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin: 20px 0 12px;
            flex-wrap: wrap;
        }
        #guessInput {
            flex: 1 1 200px;
            padding: 16px 18px;
            border: 2px solid #cbd6e3;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 500;
            text-transform: uppercase;
            background: white;
            outline: none;
            transition: border 0.15s;
        }
        #guessInput:focus {
            border-color: #1a3b5d;
        }
        .primary-btn {
            background: #2e6b3e;
            color: white;
            border: none;
            padding: 16px 28px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 0 #1d4529;
            transition: 0.07s linear;
            border: 1px solid #58a36f;
        }
        .primary-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1d4529;
        }
        .primary-btn:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: 0 6px 0 #1d4529;
            pointer-events: none;
        }
        .message {
            min-height: 40px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #1a3b5d;
            margin: 12px 0 8px;
            padding: 8px 12px;
            background: #e8f0fe;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reward-row {
            display: flex;
            gap: 12px;
            margin: 24px 0 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .reward-btn {
            background: #f4a261;
            border: none;
            color: #2d1f00;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 14px 24px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 0 #b96f2e;
            transition: 0.07s linear;
            flex: 1 1 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid #ffc107;
        }
        .reward-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b96f2e;
        }
        .reward-btn i {
            font-style: normal;
            font-size: 1.3rem;
        }
        .ad-section-title {
            font-size: 0.9rem;
            color: #1a3b5d;
            margin: 20px 0 10px;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .interstitial-btn {
            background: #9b59b6;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 14px 24px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 0 #6c3483;
            transition: 0.07s linear;
            width: 100%;
            border: 1px solid #c39bd3;
        }
        .interstitial-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #6c3483;
        }
        .task-btn {
            background: #27ae60;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 14px 24px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1e8449;
            transition: 0.07s linear;
            width: 100%;
            border: 1px solid #6fcf97;
        }
        .task-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1e8449;
        }
        .debug-badge {
            background: #ff6b6b;
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
            text-transform: uppercase;
        }
        .debug-info {
            background: #f0f0f0;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            font-size: 0.8rem;
            border-left: 4px solid #ff6b6b;
        }
        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #5d738b;
            display: flex;
            justify-content: center;
            gap: 24px;
            border-top: 1px dashed #b3c7db;
            padding-top: 20px;
        }
        footer a {
            color: #1a3b5d;
            text-decoration: none;
            font-weight: 500;
        }
        footer a:hover {
            text-decoration: underline;
        }
        .score-badge {
            background: #d4e0eb;
            border-radius: 50px;
            padding: 6px 16px;
            font-size: 1rem;
            font-weight: 600;
            color: #0f2a41;
            display: inline-block;
        }
        .block-id-badge {
            font-size: 0.7rem;
            background: rgba(26, 59, 93, 0.1);
            padding: 4px 8px;
            border-radius: 20px;
            margin: 5px 0;
            color: #1a3b5d;
        }
    </style>
</head>
<body>
    <div class="game-card">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <h1>🔤 SCRAMBLE<span>free</span></h1>
            <div class="score-badge" id="scoreDisplay">0</div>
        </div>
        <p style="color: #4a5f73; margin-bottom: 8px;">unscramble the word — no ads needed</p>

        <!-- Debug Mode Notice -->
        <div class="debug-info">
            🔧 <strong>DEBUG MODE ENABLED</strong> - Test ads will show<br>
            Blocks: 24919 (reward) | int-24917 (interstitial) | task-24920 (task)
        </div>

        <div class="scrambled-box">
            <div id="scrambledWord">......</div>
        </div>

        <div class="input-area">
            <input type="text" id="guessInput" placeholder="YOUR GUESS" maxlength="20" autocomplete="off">
            <button class="primary-btn" id="submitGuess">GUESS</button>
        </div>

        <div id="message" class="message">✨ type your answer</div>

        <!-- REWARDED ADS (24919) - User gets reward after watching -->
        <div class="ad-section-title">
            🎁 REWARDED ADS <span class="debug-badge">24919</span>
        </div>
        <div class="reward-row">
            <button class="reward-btn" id="hintBtn"><i>🔍</i> Hint (watch ad)</button>
            <button class="reward-btn" id="skipBtn"><i>🌀</i> Skip word (watch ad)</button>
        </div>

        <!-- INTERSTITIAL ADS (int-24917) - Can be skipped -->
        <div class="ad-section-title">
            📺 INTERSTITIAL ADS <span class="debug-badge">int-24917</span>
        </div>
        <button class="interstitial-btn" id="interstitialBtn">🎮 Show Interstitial Ad</button>

        <!-- TASK ADS (task-24920) - No initialization needed -->
        <div class="ad-section-title">
            📋 TASK ADS <span class="debug-badge">task-24920</span>
        </div>
        <button class="task-btn" id="taskBtn">✅ Show Task Ad</button>

        <footer>
            <a href="#" target="_blank" id="privacyLink">📄 Privacy Policy</a>
            <span>v1.0 (debug)</span>
        </footer>
    </div>

    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <script>
        (function() {
            // ====================================================
            // YOUR BLOCK IDS
            // ====================================================
            const REWARD_BLOCK_ID = "24919";           // Rewarded ad format
            const INTERSTITIAL_BLOCK_ID = "int-24917";  // Interstitial ad format
            const TASK_BLOCK_ID = "task-24920";         // Task ad format
            
            // ====================================================
            // WORD LIST
            // ====================================================
            const words = [
                "PLANET", "MOUNTAIN", "COFFEE", "WINDOW", "GALAXY", 
                "PYTHON", "JOURNEY", "HARMONY", "VELVET", "CRYSTAL",
                "THUNDER", "MEADOW", "SAFARI", "POCKET", "BRAIN",
                "FLAMINGO", "KITTEN", "PUZZLE", "RIDDLE", "SUMMER",
                "WINTER", "AUTUMN", "SPRING", "CLOUD", "RIVER",
                "HORIZON", "DIAMOND", "SILVER", "GARDEN", "BREEZE"
            ];

            // Game state
            let currentWord = "";
            let scrambled = "";
            let score = 0;
            let rewardedController = null;
            let interstitialController = null;

            // DOM elements
            const scrambledEl = document.getElementById('scrambledWord');
            const guessInput = document.getElementById('guessInput');
            const submitBtn = document.getElementById('submitGuess');
            const messageEl = document.getElementById('message');
            const scoreEl = document.getElementById('scoreDisplay');
            const hintBtn = document.getElementById('hintBtn');
            const skipBtn = document.getElementById('skipBtn');
            const interstitialBtn = document.getElementById('interstitialBtn');
            const taskBtn = document.getElementById('taskBtn');

            // ====================================================
            // INITIALIZE ADSGRAM SDK WITH DEBUG MODE ENABLED
            // ====================================================
            function initAdsgram() {
                try {
                    if (window.Adsgram) {
                        console.log('✅ Adsgram SDK loaded, initializing with DEBUG MODE...');
                        
                        // Initialize Rewarded Ad Controller (24919) with debug mode
                        rewardedController = window.Adsgram.init({ 
                            blockId: REWARD_BLOCK_ID,
                            debug: true,  // DEBUG MODE ENABLED - shows test ads
                            debugBannerType: "RewardedVideo"  // Type of test ad
                        });
                        console.log('✅ Rewarded ads initialized (debug mode):', REWARD_BLOCK_ID);
                        
                        // Initialize Interstitial Ad Controller (int-24917) with debug mode
                        interstitialController = window.Adsgram.init({ 
                            blockId: INTERSTITIAL_BLOCK_ID,
                            debug: true,  // DEBUG MODE ENABLED
                            debugBannerType: "FullscreenMedia"  // Type of test ad
                        });
                        console.log('✅ Interstitial ads initialized (debug mode):', INTERSTITIAL_BLOCK_ID);
                        
                        messageEl.innerText = '✅ Ads ready! Click any ad button to test';
                        
                    } else {
                        console.error('❌ Adsgram SDK not loaded, retrying...');
                        messageEl.innerText = '⏳ Loading ads...';
                        setTimeout(initAdsgram, 1000);
                    }
                } catch (error) {
                    console.error('❌ Adsgram init error:', error);
                    messageEl.innerText = '❌ Ads failed to load';
                }
            }

            // Initialize when page loads
            initAdsgram();

            // ====================================================
            // SHOW REWARDED AD (24919) - WITH DEBUG
            // ====================================================
            function showRewardedAd(rewardCallback) {
                if (!rewardedController) {
                    alert('Rewarded ads not ready. Please try again.');
                    return;
                }

                messageEl.innerText = '⏳ Loading rewarded ad (debug mode)...';
                console.log('🎬 Showing rewarded ad...');
                
                rewardedController.show()
                    .then((result) => {
                        console.log('✅ Rewarded ad completed:', result);
                        console.log('   - done:', result.done);
                        console.log('   - state:', result.state);
                        
                        if (result.done) {
                            // User watched till the end - give reward
                            if (rewardCallback) rewardCallback();
                            messageEl.innerText = '✨ Thanks for watching! Here\'s your reward:';
                        } else {
                            messageEl.innerText = '❌ Ad not completed. No reward.';
                        }
                    })
                    .catch((result) => {
                        console.log('❌ Rewarded ad error:', result);
                        console.log('   - error:', result.error);
                        console.log('   - description:', result.description);
                        messageEl.innerText = '❌ Ad failed. Try again?';
                    });
            }

            // ====================================================
            // SHOW INTERSTITIAL AD (int-24917) - WITH DEBUG
            // ====================================================
            function showInterstitialAd() {
                if (!interstitialController) {
                    alert('Interstitial ads not ready. Please try again.');
                    return;
                }

                messageEl.innerText = '⏳ Loading interstitial ad (debug mode)...';
                console.log('🎬 Showing interstitial ad...');
                
                interstitialController.show()
                    .then((result) => {
                        console.log('✅ Interstitial ad completed/closed:', result);
                        console.log('   - done:', result.done);
                        console.log('   - state:', result.state);
                        
                        if (result.done) {
                            messageEl.innerText = '📺 Ad watched completely! +1 bonus!';
                        } else {
                            messageEl.innerText = '📺 Ad closed. +1 bonus!';
                        }
                        
                        // Give bonus point for interstitial
                        score++;
                        updateScore();
                    })
                    .catch((result) => {
                        console.log('❌ Interstitial ad error:', result);
                        console.log('   - error:', result.error);
                        console.log('   - description:', result.description);
                        messageEl.innerText = '❌ Interstitial ad failed.';
                    });
            }

            // ====================================================
            // SHOW TASK AD (task-24920) - WITH DEBUG
            // ====================================================
            function showTaskAd() {
                if (!window.Adsgram || !window.Adsgram.TaskAd) {
                    alert('Task ads not available. Please try again.');
                    return;
                }

                messageEl.innerText = '⏳ Loading task ad (debug mode)...';
                console.log('🎬 Showing task ad...');
                
                // Task ad format - different API
                const taskAd = window.Adsgram.TaskAd.init({ 
                    blockId: TASK_BLOCK_ID,
                    debug: true  // Task ads also support debug mode
                });
                
                taskAd.show()
                    .then((result) => {
                        console.log('✅ Task ad completed:', result);
                        messageEl.innerText = '✅ Task completed! +2 bonus points!';
                        
                        // Give bonus for completing task
                        score += 2;
                        updateScore();
                    })
                    .catch((result) => {
                        console.log('❌ Task ad error:', result);
                        messageEl.innerText = '❌ Task failed. Try again?';
                    });
            }

            // ====================================================
            // GAME FUNCTIONS
            // ====================================================
            function shuffleWord(word) {
                const arr = word.split('');
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr.join('');
            }

            function nextWord() {
                const randomIndex = Math.floor(Math.random() * words.length);
                currentWord = words[randomIndex].toUpperCase();
                scrambled = shuffleWord(currentWord);
                scrambledEl.innerText = scrambled;
                guessInput.value = '';
                messageEl.innerText = '🔎 new word!';
            }

            function updateScore() {
                scoreEl.innerText = score;
            }

            function checkGuess() {
                const guess = guessInput.value.trim().toUpperCase();
                if (guess === '') {
                    messageEl.innerText = '✏️ type your guess first';
                    return;
                }
                if (guess === currentWord) {
                    messageEl.innerText = '✅ CORRECT! +1 point';
                    score++;
                    updateScore();
                    nextWord();
                } else {
                    messageEl.innerText = '❌ not correct, try again';
                }
                guessInput.value = '';
            }

            // ====================================================
            // EVENT LISTENERS
            // ====================================================
            
            // Game buttons
            submitBtn.addEventListener('click', checkGuess);
            guessInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkGuess();
            });

            // Rewarded ad buttons (24919)
            hintBtn.addEventListener('click', () => {
                showRewardedAd(() => {
                    const firstLetter = currentWord[0];
                    messageEl.innerText = `🔍 Hint: first letter is “${firstLetter}”`;
                });
            });

            skipBtn.addEventListener('click', () => {
                showRewardedAd(() => {
                    nextWord();
                    messageEl.innerText = '✨ skipped to new word';
                });
            });

            // Interstitial ad button (int-24917)
            interstitialBtn.addEventListener('click', showInterstitialAd);

            // Task ad button (task-24920)
            taskBtn.addEventListener('click', showTaskAd);

            // ====================================================
            // INITIALIZATION
            // ====================================================
            
            // Start the game
            nextWord();
            
            // Update privacy link - REPLACE THIS WITH YOUR ACTUAL PRIVACY URL
            document.getElementById('privacyLink').href = '#'; // Change to your privacy policy URL

            // Telegram Mini App integration
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                console.log('✅ Telegram WebApp initialized');
            }

            // Log to console for debugging
            console.log('🚀 ScrambleMaster started with debug mode');
            console.log('Block IDs:', {
                rewarded: REWARD_BLOCK_ID,
                interstitial: INTERSTITIAL_BLOCK_ID,
                task: TASK_BLOCK_ID
            });

        })();
    </script>

    <!-- Telegram Web App script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
